name: Affiliate catalog cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: affiliate-catalog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Validate automation
        run: pnpm check && pnpm test
      - name: Curate offers
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AMAZON_BR_TAG: ${{ secrets.AMAZON_BR_TAG }}
          AMAZON_US_TAG: ${{ secrets.AMAZON_US_TAG }}
          MIN_REAL_DISCOUNT_PERCENT: '15'
          MAX_OFFERS_PER_CATEGORY: '20'
          MAX_CONCURRENCY: '3'
          ENABLE_WHATSAPP_DISPATCH: 'false'
        run: pnpm start
