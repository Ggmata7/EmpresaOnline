name: Affiliate catalog cycle

on:
  workflow_dispatch:
    inputs:
      scale_catalog:
        description: 'Expandir até 100 produtos nacionais por categoria'
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

concurrency:
  group: affiliate-catalog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync_normalized:
    if: vars.CATCH_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync normalized marketplace offers
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/sync-catalog.mjs

  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_MODE: public
      COLLECTOR_DISCOVERY: 'true'
      COLLECTOR_DISCOVERY_PAGES: '2'
      AMAZON_BR_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_BR_CREATORS_CLIENT_ID }}
      AMAZON_BR_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_BR_CREATORS_CLIENT_SECRET }}
      AMAZON_US_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_US_CREATORS_CLIENT_ID }}
      AMAZON_US_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_US_CREATORS_CLIENT_SECRET }}
      MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install application and collector dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile
      - name: Validate automation
        run: pnpm check && pnpm test

      - name: Curate offers
        if: inputs.scale_catalog != true
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AMAZON_BR_TAG: ${{ secrets.AMAZON_BR_TAG }}
          AMAZON_US_TAG: ${{ secrets.AMAZON_US_TAG }}
          MIN_REAL_DISCOUNT_PERCENT: '15'
          MAX_OFFERS_PER_CATEGORY: '100'
          MAX_CONCURRENCY: '3'
          ENABLE_WHATSAPP_DISPATCH: 'false'
        run: pnpm start
      - name: Expand verified catalog
        if: inputs.scale_catalog == true
        working-directory: .
        run: node scripts/seed-catalog-scale.ts
      - name: Report verified catalog
        if: always()
        working-directory: .
        run: node scripts/verify-scale.ts
