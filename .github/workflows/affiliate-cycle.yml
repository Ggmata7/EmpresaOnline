name: Affiliate catalog cycle

on:
  workflow_dispatch:
    inputs:
      scale_catalog:
        description: 'Forçar expansão manual de catálogo'
        type: boolean
        default: false
  schedule:
    # Executa a cada 1 hora (no minuto 0)
    - cron: '0 * * * *'

concurrency:
  group: affiliate-catalog-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_MODE: public
      COLLECTOR_DISCOVERY: 'true'
      COLLECTOR_DISCOVERY_PAGES: '10'
      AMAZON_BR_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_BR_CREATORS_CLIENT_ID }}
      AMAZON_BR_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_BR_CREATORS_CLIENT_SECRET }}
      AMAZON_US_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_US_CREATORS_CLIENT_ID }}
      AMAZON_US_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_US_CREATORS_CLIENT_SECRET }}
      MERCADO_LIVRE_ACCESS_TOKEN: ${{ secrets.MERCADO_LIVRE_ACCESS_TOKEN }}
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # 1. Curadoria principal de ofertas
      - name: Curate offers
        if: github.event_name == 'schedule' || inputs.scale_catalog != true
        env:
          SOURCES_JSON: ${{ secrets.SOURCES_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AMAZON_BR_TAG: ${{ secrets.AMAZON_BR_TAG }}
          AMAZON_US_TAG: ${{ secrets.AMAZON_US_TAG }}
          MIN_REAL_DISCOUNT_PERCENT: '15'
          MAX_OFFERS_PER_CATEGORY: '300'
          MAX_CONCURRENCY: '2'
          ENABLE_WHATSAPP_DISPATCH: 'false'
        run: pnpm start

      # 2. Expansão de catálogo usando node (original)
      - name: Expand verified catalog
        if: github.event_name == 'schedule' || inputs.scale_catalog == true
        working-directory: .
        run: node scripts/seed-catalog-scale.ts

      # 3. Relatório final com proteção total de término
      - name: Report verified catalog
        if: always()
        continue-on-error: true
        working-directory: .
        run: node scripts/verify-scale.ts

  sync_normalized:
    needs: curate
    if: vars.CATCH_SYNC_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sync normalized marketplace offers
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/sync-catalog.mjs

  trigger_vercel_deploy:
    needs: [curate, sync_normalized]
    if: always() && (needs.curate.result == 'success') && (needs.sync_normalized.result == 'success' || needs.sync_normalized.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
