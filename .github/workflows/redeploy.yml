name: Hourly Redeploy

on:
  schedule:
    # Executa a cada 1 hora (no minuto 0)
    - cron: '0 * * * *'
  workflow_dispatch: # Botão para testar manualmente quando quiser

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Vercel Deploy Hook
        run: |
          curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
